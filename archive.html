<div id="pftu-archive">
  <div class="pftu-header"><div class="pftu-kicker">POSTCARDS FROM THE UNDERGROUND / THE COLLECTION</div><h2>THE MUSIC ARCHIVE<span>.</span></h2><p>Every track. Every broadcast. Discover something different.</p></div>
  <div class="pftu-controls"><label for="pftu-query">SEARCH THE UNDERGROUND</label><input id="pftu-query" type="search" placeholder="Artist, track, label or episode…" aria-label="Search music archive"><div class="pftu-filters"><select id="pftu-year" aria-label="Filter by year"><option value="">All years</option></select><select id="pftu-sort" aria-label="Sort results"><option value="new">Newest first</option><option value="old">Oldest first</option><option value="artist">Artist A–Z</option></select></div></div>
  <div class="pftu-meta" id="pftu-count" aria-live="polite">Loading archive…</div><div id="pftu-results" class="pftu-results"></div><button type="button" id="pftu-more" hidden>LOAD MORE TRACKS</button>
</div>
<style>
#pftu-archive{font-family:inherit;color:#242526;max-width:1120px;margin:auto}#pftu-archive *{box-sizing:border-box}.pftu-header{padding:36px 0 30px;border-bottom:2px solid #242526}.pftu-kicker{font-size:11px;letter-spacing:.2em;font-weight:700}.pftu-header h2{font-size:clamp(30px,5vw,62px);font-weight:800;line-height:1.05;letter-spacing:-.045em;margin:18px 0 12px}.pftu-header h2 span{color:#bc503e}.pftu-header p{font-size:15px;color:#676767}.pftu-controls{padding:26px 0}.pftu-controls label{display:block;font-size:11px;letter-spacing:.16em;font-weight:700;margin-bottom:10px}#pftu-query{width:100%;padding:16px 17px;border:1px solid #aaa;border-radius:0;font:inherit;background:white;color:#222}.pftu-filters{display:flex;gap:12px;margin-top:12px}.pftu-filters select{flex:1;min-width:0;padding:12px;background:white;border:1px solid #aaa;color:#222;font:inherit}.pftu-meta{font-size:12px;letter-spacing:.1em;font-weight:700;text-transform:uppercase;padding:12px 0;border-bottom:1px solid #ccc}.pftu-item{display:grid;grid-template-columns:42px minmax(0,1fr) auto;gap:15px;align-items:center;border-bottom:1px solid #ddd;padding:18px 0}.pftu-num{font-size:13px;color:#999;font-variant-numeric:tabular-nums}.pftu-artist{font-size:18px;font-weight:750;line-height:1.3}.pftu-track{font-size:15px;margin-top:3px}.pftu-details{font-size:12px;color:#666;margin-top:8px}.pftu-actions{display:flex;gap:12px;flex-wrap:wrap;justify-content:flex-end}.pftu-actions a{font-size:12px;text-decoration:underline;text-underline-offset:3px;color:#242526}#pftu-more{width:100%;padding:15px;border:1px solid #222;background:#222;color:white;font:inherit;font-weight:700;margin-top:20px;cursor:pointer}@media(max-width:600px){.pftu-item{grid-template-columns:26px 1fr}.pftu-actions{grid-column:2;justify-content:flex-start}.pftu-artist{font-size:16px}}
</style>
<script>
(function(){
 const root=document.getElementById('pftu-archive');if(root.dataset.ready)return;root.dataset.ready='1';
 // REPLACE with the public HTTPS URL where you host tracks.json.
 const DATA_URL='https://dptvn54kvn-alt.github.io/Music-archive-/tracks.json';
 const q=root.querySelector('#pftu-query'),year=root.querySelector('#pftu-year'),sort=root.querySelector('#pftu-sort'),results=root.querySelector('#pftu-results'),count=root.querySelector('#pftu-count'),more=root.querySelector('#pftu-more');
 let data=[],visible=50,filtered=[];
 function el(tag,cls,txt){const n=document.createElement(tag);if(cls)n.className=cls;if(txt!==undefined)n.textContent=txt;return n}
 function link(parent,label,url){if(!/^https:\/\//i.test(url||''))return;const a=el('a','',label);a.href=url;a.target='_blank';a.rel='noopener noreferrer';parent.append(a)}
 function render(){const query=q.value.trim().toLocaleLowerCase(),y=year.value;filtered=data.filter(x=>(!y||(x.date||'').startsWith(y))&&[x.artist,x.track,x.label,x.episode,x.date].some(s=>String(s||'').toLocaleLowerCase().includes(query)));filtered.sort((a,b)=>sort.value==='artist'?String(a.artist).localeCompare(String(b.artist)):sort.value==='old'?String(a.date).localeCompare(String(b.date)):String(b.date).localeCompare(String(a.date)));count.textContent=filtered.length.toLocaleString()+' track appearances · '+new Set(filtered.map(x=>x.episode_url)).size.toLocaleString()+' episodes';results.replaceChildren();filtered.slice(0,visible).forEach((x,i)=>{const item=el('article','pftu-item');item.append(el('div','pftu-num',String(i+1).padStart(2,'0')));const info=el('div','');info.append(el('div','pftu-artist',x.artist),el('div','pftu-track',x.track),el('div','pftu-details',[x.label,x.episode,x.date].filter(Boolean).join(' · ')));item.append(info);const actions=el('div','pftu-actions');link(actions,'Episode',x.episode_url);if(x.video_url)link(actions,'Video',x.video_url);if(Array.isArray(x.links)){const release=x.links.find(z=>z.url&&z.url!==x.video_url&&/^https:\/\//i.test(z.url));if(release)link(actions,'Release',release.url)}item.append(actions);results.append(item)});more.hidden=visible>=filtered.length}
 function reset(){visible=50;render()}q.addEventListener('input',reset);year.addEventListener('change',reset);sort.addEventListener('change',reset);more.addEventListener('click',()=>{visible+=50;render()});
 if(DATA_URL.startsWith('REPLACE_')){count.textContent='Setup required: add your hosted tracks.json URL in the code.';return}
 fetch(DATA_URL).then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json()}).then(rows=>{if(!Array.isArray(rows))throw Error('Invalid data');data=rows;[...new Set(data.map(x=>(x.date||'').slice(0,4)).filter(Boolean))].sort().reverse().forEach(y=>{const opt=el('option','',y);opt.value=y;year.append(opt)});render()}).catch(e=>{count.textContent='Unable to load archive: '+e.message;console.error(e)});
})();
</script>
fetch('/tracks.json')
